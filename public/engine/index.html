<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Studio — Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#f4f4f6;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{width:100%;max-width:440px;padding:14px 20px 4px;text-align:center}
.note{font-size:11px;color:#86868b;letter-spacing:.02em}
.skins{display:inline-flex;gap:4px;margin-top:8px;padding:3px;background:#e8e8ec;border-radius:999px}
.skins button{padding:7px 18px;border-radius:999px;font-size:13px;font-weight:500;color:#6e6e73;transition:all .25s}
.skins button.on{background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ---------- templates ---------- */
.app,.webf{--bg0:#f7f7f6;--bg:#f7f7f6;--ink:#151515;--mute:#8a8985;--line:rgba(0,0,0,.1);--chip:rgba(0,0,0,.05);--acc:#151515;--accink:#fff;--stage:radial-gradient(circle at 50% 40%,#fff 0%,#e9e8e5 100%);--row:#fff;--sh:0 1px 2px rgba(0,0,0,.05);--sheet:#fff;--disp:'Montserrat',sans-serif;--dw:300;--ds:normal;--wm:'Montserrat',sans-serif}
.t-veralight{--bg0:#f7f7f6;--bg:#f7f7f6}
.t-verasand{--bg0:#f1e0cf;--bg:linear-gradient(180deg,#f6e8da,#ead3bb);--ink:#2a2118;--mute:#8d7662;--line:rgba(80,55,30,.16);--chip:rgba(255,255,255,.5);--acc:#4a3e2b;--accink:#fff;--stage:radial-gradient(circle at 50% 40%,#fbefe2,#e5cbb0);--row:rgba(255,255,255,.55);--sh:none;--sheet:#f6e8da;--disp:'Cormorant Garamond',serif;--dw:500;--wm:'Cormorant Garamond',serif}
.t-veradark{--bg0:#12100e;--bg:#12100e;--ink:#f1e9dc;--mute:#9d9486;--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.07);--acc:#c9a867;--accink:#1a140a;--stage:radial-gradient(circle at 50% 40%,#2d261d,#0e0c0a);--row:rgba(255,255,255,.05);--sh:none;--sheet:#17130f;--disp:'Cormorant Garamond',serif;--dw:500;--wm:'Cormorant Garamond',serif}
.t-veramed{--bg0:#a98258;--bg:linear-gradient(180deg,#b28b62,#8f6c49);--ink:#fffaf2;--mute:#f0e0cb;--line:rgba(255,255,255,.28);--chip:rgba(255,255,255,.18);--acc:#1b1510;--accink:#fff;--stage:radial-gradient(circle at 50% 40%,#c9a47c,#7d5d3e);--row:rgba(255,255,255,.16);--sh:none;--sheet:#8f6c49;--disp:'Cormorant Garamond',serif;--dw:500;--wm:'Cormorant Garamond',serif}
.t-noir{--bg0:#15110e;--bg:radial-gradient(120% 60% at 70% 0%,#2b231a,#0f0c0a 60%);--ink:#f3ebe0;--mute:#a09686;--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.07);--acc:#d9c4a6;--accink:#1a140a;--stage:radial-gradient(circle at 50% 40%,#342b21,#0f0c0a);--row:rgba(255,255,255,.05);--sh:none;--sheet:#17130f;--disp:'Cormorant Garamond',serif;--dw:500;--ds:italic;--wm:'Cormorant Garamond',serif}
.t-nova{--bg0:#0d0b0a;--bg:radial-gradient(120% 60% at 30% 0%,#2a2016,#0b0908 60%);--ink:#f6eee2;--mute:#a39888;--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.07);--acc:#c99f63;--accink:#1a1208;--stage:radial-gradient(circle at 50% 40%,#30271c,#0b0908);--row:rgba(255,255,255,.05);--sh:none;--sheet:#15110d;--disp:'Cormorant Garamond',serif;--dw:500;--ds:italic;--wm:'Cormorant Garamond',serif}
.t-kinara{--bg0:#14100c;--bg:radial-gradient(120% 70% at 20% 10%,#33281c,#0f0c09 62%);--ink:#f5ece0;--mute:#a3977f;--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.07);--acc:#d9a45a;--accink:#1a1208;--stage:radial-gradient(circle at 50% 40%,#35291c,#0f0c09);--row:rgba(255,255,255,.05);--sh:none;--sheet:#17120d;--disp:'Cormorant Garamond',serif;--dw:500;--ds:italic;--wm:'Cormorant Garamond',serif}
.t-lumina{--bg0:#0f0c0a;--bg:radial-gradient(120% 60% at 50% 0%,#2a2017,#0d0a08 60%);--ink:#f6ede1;--mute:#a09584;--line:rgba(255,255,255,.12);--chip:rgba(255,255,255,.07);--acc:#e0a864;--accink:#1a1208;--stage:radial-gradient(circle at 50% 40%,#33281c,#0d0a08);--row:rgba(255,255,255,.05);--sh:none;--sheet:#16110d;--disp:'Cormorant Garamond',serif;--dw:500;--ds:italic;--wm:'Cormorant Garamond',serif}
.t-velora{--bg0:#dfe3ea;--bg:linear-gradient(180deg,#e3e7ee,#c8d0dc);--ink:#122033;--mute:#5f6f84;--line:rgba(18,32,51,.14);--chip:rgba(255,255,255,.6);--acc:#2d7bff;--accink:#fff;--stage:radial-gradient(circle at 50% 40%,#f2f5f9,#bccadb);--row:rgba(255,255,255,.62);--sh:0 4px 18px rgba(40,70,120,.08);--sheet:#e8edf3;--disp:'Cormorant Garamond',serif;--dw:500;--wm:'Cormorant Garamond',serif}
.t-maison{--bg0:#f3ece3;--bg:#f3ece3;--ink:#17120d;--mute:#85796b;--line:rgba(30,20,10,.14);--chip:rgba(255,255,255,.55);--acc:#17120d;--accink:#fff;--stage:radial-gradient(circle at 50% 40%,#faf5ee,#e5dacb);--row:rgba(255,255,255,.6);--sh:none;--sheet:#f3ece3;--disp:'Cormorant Garamond',serif;--dw:500;--wm:'Cormorant Garamond',serif}
.t-velora .rsv{box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}
.app.dk .rsv{box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}
.t-veramed .rsv{box-shadow:inset 0 0 0 1px #fff;color:#fff}

.app{position:relative;width:100%;max-width:420px;height:calc(100svh - 96px);min-height:640px;overflow:hidden;background:var(--bg);color:var(--ink);transition:background .5s,color .5s}
@media(min-width:520px){.app{height:800px;margin:8px 0 40px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.14)}}
.disp{font-family:var(--disp);font-weight:var(--dw);font-style:var(--ds);letter-spacing:-.01em}

/* header + tabs */
.hdr.solid{background:linear-gradient(var(--bg0) 82%,transparent)}
.hdr{transition:background .3s;position:absolute;top:0;left:0;right:0;height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.hdr .logo{text-align:center;line-height:1.15}
.hdr .logo b{display:block;font-family:var(--disp);font-weight:500;font-size:19px;letter-spacing:.32em;padding-left:.32em;font-style:normal}
.hdr .logo span{font-size:7.5px;letter-spacing:.34em;color:var(--mute)}
.hdr .l,.hdr .r{display:flex;align-items:center;gap:6px;min-width:96px}
.hdr .r{justify-content:flex-end}
.lang{font-size:12px;font-weight:600;padding:7px 10px;border-radius:999px;background:var(--chip);letter-spacing:.04em}
.ibtn{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.ibtn svg{width:21px;height:21px}
.badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:var(--accink);font-size:10px;font-weight:600;display:none;place-items:center;padding:0 4px}
.rsv{font-size:12px;font-weight:500;padding:8px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:72px;padding:6px 14px 10px;display:flex;justify-content:space-around;z-index:5;background:linear-gradient(0deg,var(--sheet) 55%,transparent);}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);padding:6px 12px;transition:color .25s}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--acc)}
.t-veralight .tabs button.on,.t-maison .tabs button.on,.t-verasand .tabs button.on{color:var(--ink)}.t-veramed .tabs button.on{color:#fff}

.view{position:absolute;inset:64px 0 72px 0;padding:6px 20px 24px;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .4s,transform .4s;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{opacity:1;pointer-events:auto;transform:none}

/* shared */
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--accink);font-weight:500;font-size:15px;padding:13px 26px;border-radius:999px;transition:transform .15s,opacity .2s}
.pill:active{transform:scale(.97)}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.pill[disabled]{opacity:.4;pointer-events:none}
.pill svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;background:var(--chip);color:var(--mute);transition:all .2s;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accink)}

/* menu */
.hero{text-align:center;padding:6px 0 4px}
.hero img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;display:block}
.hero .eyebrow{margin-top:18px}
.hero h1{font-size:38px;line-height:1.02;margin-top:6px}
.hero p{margin-top:8px;font-size:15px;color:var(--mute)}
.hero .pill{margin-top:16px}
.cats{display:flex;justify-content:center;gap:20px;margin:22px 0 12px}
.cats button{font-size:14px;color:var(--mute);padding:6px 0;position:relative;transition:color .2s}
.cats button.on{color:var(--ink);font-weight:600}
.cats button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:1px;background:var(--acc)}
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.drow{display:flex;align-items:center;gap:14px;padding:10px;border-radius:20px;background:var(--row);box-shadow:var(--sh);cursor:pointer;transition:transform .15s}
.drow:active{transform:scale(.99)}
.drow img{width:78px;height:78px;border-radius:14px;object-fit:cover;flex:none}
.dmeta{flex:1;min-width:0}
.dmeta b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.dmeta span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmeta em{font-style:normal;font-size:15px;font-weight:600;display:block;margin-top:5px}
.heart{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--mute);flex:none}
.heart svg{width:20px;height:20px}
.heart.on{color:#e0405a}
.empty{padding:34px 10px;text-align:center;color:var(--mute);font-size:15px;line-height:1.4}

/* dish */
.back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--mute);padding:4px 0}
.back svg{width:18px;height:18px}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.trow h2{font-size:32px;line-height:1.05}
.price{font-size:22px;font-weight:600}
.stage{position:relative;margin-top:14px;aspect-ratio:1/1;border-radius:28px;background:var(--stage);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:pan-y;cursor:grab}
.stage.photo img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1)}}
.stage .tag{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--mute);pointer-events:none;z-index:2;text-shadow:0 0 8px var(--sheet)}
.nav{position:absolute;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);z-index:3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav.p{left:12px}.nav.n{right:12px}.nav svg{width:18px;height:18px}
.acts{display:flex;gap:10px;margin-top:16px;align-items:center}
.acts .pill{flex:1}
.sq{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.sq svg{width:21px;height:21px}
.sq.on{color:#e0405a}
.pairline{margin-top:12px;font-size:14px;color:var(--mute);line-height:1.4;max-height:0;overflow:hidden;transition:max-height .3s}
.pairline.on{max-height:60px}
.sec{margin-top:22px}
.sec h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:500;margin-bottom:10px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag2{padding:7px 13px;border-radius:999px;font-size:13px;background:var(--chip)}
.tag2.al{box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.conf{margin-top:8px;font-size:12px;color:var(--mute)}
.chef{font-size:15px;line-height:1.5;color:var(--ink)}
.addrow{margin-top:24px}
.addrow .pill{width:100%}

/* ask */
.askh h1{font-size:34px;line-height:1.05}
.askh p{margin-top:6px;font-size:15px;color:var(--mute)}
.langs{display:flex;gap:6px;margin-top:14px}
.chat{margin-top:14px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.msg{max-width:86%;padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.4;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.a{background:var(--chip);align-self:flex-start;border-bottom-left-radius:6px}
.msg.u{background:var(--acc);color:var(--accink);align-self:flex-end;border-bottom-right-radius:6px}
.msg .ph{display:flex;gap:8px;margin-top:10px}
.msg .ph img{width:62px;height:62px;object-fit:cover;border-radius:12px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin:0 2px;animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sugg button{padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.askform{display:flex;gap:8px;margin-top:14px}
.askform input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:12px 16px;outline:none}
.askform input::placeholder{color:var(--mute)}
.askform button{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;flex:none}
.askform button svg{width:20px;height:20px}
.askform .mic{background:var(--chip);color:var(--ink)}
.fine{margin-top:10px;font-size:11px;color:var(--mute);text-align:center;min-height:14px}

/* saved */
.savedh h1{font-size:34px;line-height:1.05;margin-bottom:6px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 22px 30px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:31;max-height:80%;overflow-y:auto}
.sheet.on{transform:none}
.sheet h3{font-size:26px;margin-bottom:14px}
.sheet .lab{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.sheet .pill{width:100%;margin-top:20px}
.sheet .msgfine{margin-top:12px;font-size:13px;color:var(--mute);text-align:center}

/* AR */
.ar{position:absolute;inset:0;z-index:40;background:#111;opacity:0;pointer-events:none;transition:opacity .4s}
.ar.on{opacity:1;pointer-events:auto}
.ar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}
.arhost{position:absolute;left:50%;bottom:11%;width:min(100%,360px);aspect-ratio:1;transform:translateX(-50%)}
.arhost canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:pan-y}
.arscan{position:absolute;top:22%;left:0;right:0;text-align:center;color:#fff;font-size:17px;text-shadow:0 1px 12px rgba(0,0,0,.45);transition:opacity .5s}
.arscan i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin:0 3px;animation:pulse 1s infinite}
.arscan i:nth-child(2){animation-delay:.2s}.arscan i:nth-child(3){animation-delay:.4s}
.arbottom{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:#fff;transition:opacity .5s}
.arbottom p{font-size:15px;text-shadow:0 1px 10px rgba(0,0,0,.5);margin-bottom:12px}
.arbottom button{background:rgba(255,255,255,.92);color:#1d1d1f;padding:11px 26px;border-radius:999px;font-weight:600;font-size:15px}
.artag{position:absolute;top:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.92);font-size:11px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:50;white-space:nowrap}
.dk .toast{background:var(--acc);color:var(--accink)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* hero */
.heroimg{height:300px;margin:0 -20px;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.hero{margin-top:-36px;position:relative}
.hero .acts2{display:flex;justify-content:center;gap:12px;margin-top:16px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--row);box-shadow:var(--sh);font-size:12px;color:var(--ink)}
.quick button svg{width:22px;height:22px}
.askpill{display:flex;align-items:center;gap:10px;margin-top:18px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--row);box-shadow:inset 0 0 0 1px var(--acc);font-size:15px;color:var(--mute);text-align:left;width:100%}
.askpill svg{width:18px;height:18px;color:var(--acc);flex:none}
.askpill span{flex:1}
.askpill i{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-style:normal}
.askpill i svg{color:var(--accink);width:18px;height:18px}
.orb{display:block;margin:22px auto 8px;width:78px;height:78px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--acc),0 0 30px rgba(217,164,90,.35);display:grid;place-items:center;color:var(--acc);animation:glow 3s ease-in-out infinite}
.orb svg{width:30px;height:30px}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 18px rgba(217,164,90,.25)}50%{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 38px rgba(217,164,90,.55)}}
.orbt{text-align:center;font-size:14px;color:var(--mute)}
.guide{margin-top:16px;text-align:left}
.guide button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left}
.guide button svg.l{width:26px;height:26px;flex:none;color:var(--ink)}
.guide b{display:block;font-family:var(--disp);font-size:19px;font-weight:600}
.guide span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.guide button svg.r{width:16px;height:16px;margin-left:auto;color:var(--mute);flex:none}

var renderer,scene,camera,dish3,ground,dragging=false,lastX=0,vel=0,spawn=1,spawnT=0,inAR=false;
function build(){
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x000000,0);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(32,1,0.1,50);setCam(false);
  scene.add(new THREE.HemisphereLight(0xffffff,0x9a8268,0.6));
  var key=new THREE.DirectionalLight(0xfff1e0,0.85);key.position.set(3.5,6,3);key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);var sc=key.shadow.camera;sc.left=-4;sc.right=4;sc.top=4;sc.bottom=-4;sc.near=1;sc.far=20;key.shadow.radius=5;scene.add(key);
  var fill=new THREE.DirectionalLight(0xdfe8ff,0.35);fill.position.set(-4,3,-2);scene.add(fill);
  ground=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShadowMaterial({opacity:0.16}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  dish3=new THREE.Group();scene.add(dish3);
  function mat(c,r,m){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m||0})}
  function add(geo,m,x,y,z){var o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;dish3.add(o);return o}
  var pf=[[0,0.04],[1.45,0.04],[1.85,0.10],[2.1,0.25],[2.15,0.28],[2.09,0.285],[1.82,0.19],[1.45,0.12],[0,0.12]].map(function(p){return new THREE.Vector2(p[0],p[1])});
  add(new THREE.LatheGeometry(pf,96),mat(0xeeebe6,0.25,0.02),0,0,0);
  var coulis=add(new THREE.CylinderGeometry(0.7,0.7,0.02,48),mat(0xa3102e,0.18,0.05),0.45,0.13,0.62);coulis.scale.set(1.5,1,0.62);coulis.rotation.y=-0.3;
  add(new THREE.CylinderGeometry(0.6,0.7,0.88,64),mat(0x3b2015,0.82),-0.5,0.56,-0.05);
  add(new THREE.CylinderGeometry(0.585,0.6,0.04,64),mat(0x56342a,0.95),-0.5,1.0,-0.05);
  var lava=add(new THREE.SphereGeometry(0.5,32,16),mat(0x25100a,0.16,0.12),-0.18,0.2,0.6);lava.scale.set(1.1,0.2,0.62);
  var ic=add(new THREE.SphereGeometry(0.5,48,32),mat(0xf7edd2,0.92),0.95,0.58,-0.3);ic.scale.set(1,0.93,1);
  var rb=new THREE.IcosahedronGeometry(0.17,1),rm=new THREE.MeshStandardMaterial({color:0xb5133c,roughness:0.5,flatShading:true});
  [[0.3,0.3,0.92],[0.62,0.29,0.74],[0.08,0.3,1.0]].forEach(function(p){var b=add(rb,rm,p[0],p[1],p[2]);b.scale.set(1,0.95,1)});
  var leaf=add(new THREE.SphereGeometry(0.14,16,8),mat(0x3f8f4a,0.5),0.5,0.46,0.88);leaf.scale.set(1.5,0.12,0.8);leaf.rotation.y=0.6;
  var cm=mat(0x2a1710,0.9),cg=new THREE.SphereGeometry(0.035,8,6);
  for(var i=0;i<26;i++){var a=Math.random()*6.28,r=0.95+Math.random()*0.55;add(cg,cm,0.95+Math.cos(a)*r*0.7,0.14,-0.3+Math.sin(a)*r*0.6)}
  dish3.rotation.y=-0.5;
  var cv=renderer.domElement;
  cv.addEventListener('pointerdown',function(e){dragging=true;lastX=e.clientX;vel=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',function(e){if(!dragging)return;var dx=e.clientX-lastX;lastX=e.clientX;dish3.rotation.y+=dx*0.012;vel=dx*0.012});
  var up=function(){dragging=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  requestAnimationFrame(loop);
}
function setCam(ar){
  if(ar){camera.position.set(0,4.4,8.6);camera.lookAt(0,0.1,0)}
  else{camera.position.set(0,3.0,8.4);camera.lookAt(0,0.5,0)}
}
function applySkin3D(){if(ground)ground.material.opacity=TP[S.tpl].dk?.4:.18}
function attachCanvas(){
  if(!renderer||inAR)return;
  var st=$('stage');if(!st)return;
  st.insertBefore(renderer.domElement,st.firstChild);resize();
}
function resize(){
  if(!renderer)return;
  var host=inAR?$('arhost'):$('stage');if(!host)return;
  var w=host.clientWidth||320,h=host.clientHeight||320;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
function loop(){
  requestAnimationFrame(loop);
  if(!renderer)return;
  var visible=inAR||(S.view==='dish'&&D[S.dish].has3d&&$('stage'));
  if(!visible)return;
  if(!dragging){dish3.rotation.y+=0.006+vel;vel*=0.94}
  if(spawn<1){spawnT+=0.03;var p=Math.min(spawnT,1),c=1.70158,e=1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);dish3.scale.setScalar(Math.max(0.001,e*(inAR?0.82:1)));if(p>=1)spawn=1}
  renderer.render(scene,camera);
}
function openAR(){
  if(!renderer)return;
  inAR=true;$('ar').classList.add('on');
  $('arhost').appendChild(renderer.domElement);setCam(true);resize();
  dish3.scale.setScalar(0.001);
  $('arscan').innerHTML=t('scan')+'<br><span style="display:inline-block;margin-top:12px"><i></i><i></i><i></i></span>';
  $('arscan').style.opacity=1;$('arbottom').style.opacity=0;
  $('artag').textContent=t('artag');$('arp').textContent=t('drag');$('ardone').textContent=t('done');
  setTimeout(function(){
    if(!inAR)return;
    $('arscan').style.opacity=0;spawn=0;spawnT=0;
    setTimeout(function(){if(inAR)$('arbottom').style.opacity=1},700);
  },1700);
}
function closeAR(){
  if(!inAR)return;
  inAR=false;$('ar').classList.remove('on');
  setCam(false);dish3.scale.setScalar(1);spawn=1;
  var st=$('stage');if(st)st.insertBefore(renderer.domElement,st.firstChild);resize();
}

var replying=false;
function reply(q,idx){
  if(MENU){return replyLive(q)}
  if(replying)return;replying=true;
  S.chat.push({r:'u',text:q});S.chat.push({typing:true});renderChat();
  setTimeout(function(){
    S.chat.pop();
    var r=idx>=0?CH[S.lang].ans[idx]:[CH[S.lang].other,[]];
    S.chat.push({r:'a',text:r[0],imgs:r[1]});renderChat();replying=false;
  },750);
}

  if(i!==null)i=parseInt(i,10);
  if(a==='chili')v=parseInt(v,10);
  switch(a){
   case 'skin':
     S.tpl=parseInt(v,10);setTpl();closeSheet();show('menu');break;
   case 'cyclelang':{var o=['en','fr','es'];S.lang=o[(o.indexOf(S.lang)+1)%3];renderAll();resetChat();break}
   case 'setlang':S.lang=v;renderAll();resetChat();break;
   case 'gophone':S.mode='phone';setMode();show('menu');break;
   case 'webdish':S.mode='phone';setMode();S.dish=i;renderDish();show('dish');break;
   case 'webcat':S.webCat=v;S.webOff=0;renderWeb();break;
   case 'webprev':S.webOff=(S.webOff+5)%6;renderWeb();break;
   case 'webnext':S.webOff=(S.webOff+1)%6;renderWeb();break;
   case 'burger':openSheet('burger');break;
   case 'prefs':{var ch=$('chips');if(ch)$('v-menu').scrollTo({top:ch.offsetTop-90,behavior:'smooth'});break}
   case 'mode':S.mode=v;setMode();break;
   case 'tab':
     if(v==='home'){show('menu');break}
     if(v==='list'){show('menu');setTimeout(function(){var l=$('cats0');if(l)$('v-menu').scrollTo({top:l.offsetTop-70,behavior:'smooth'})},60);break}
     if(v==='occ'){show('ask');reply(CH[S.lang].chips[3],3);break}
     if(v==='saved'){show('saved');break}
     if(v==='ask'){show('ask');break}
     if(v==='ar'){goAR(FOND);break}
     if(v==='menu'){show('menu');break}
     break;
   case 'tab_old':
     if(v==='menu')show('menu');
     else if(v==='ar'){S.dish=FOND;renderDish();show('dish');openAR()}
     else show(v);
     break;
   case 'cardplay':case 'play':{var dd=D[i];var vi=$('vimg');vi.innerHTML=dd.video?'<video src="'+esc(dd.video)+'" autoplay muted playsinline loop></video>':'';vi.classList.toggle('real',!!dd.video);vi.style.backgroundImage=dd.video?'none':'url('+dd.img+')';$('vidcap').textContent=t('vidCap');$('vidt').textContent=dn(dd).n;$('vid').classList.add('on');var pb=$('vidbar');pb.style.animation='none';void pb.offsetWidth;pb.style.animation='';break}
   case 'closevid':$('vid').classList.remove('on');$('vimg').innerHTML='';break;
   case 'cardar':goAR(i);break;
   case 'chili':{var cur=S.spice[i]||0;S.spice[i]=(cur===v)?v-1:v;renderDish();break}
   case 'askdish':{var dq=D[i],xq=dn(dq);show('ask');var msg=xq.n+'. '+xq.d+' '+t('alle')+': '+xq.a.join(', ')+'. '+t('best')+': '+xq.p+'.';S.chat.push({r:'u',text:xq.n+'?'});S.chat.push({r:'a',text:msg,imgs:[i]});renderChat();break}
   case 'open':S.dish=i;S.pair=false;renderDish();show('dish');break;
   case 'back':show('menu');break;
   case 'prev':S.dish=(S.dish+D.length-1)%D.length;S.pair=false;renderDish();break;
   case 'next':S.dish=(S.dish+1)%D.length;S.pair=false;renderDish();break;
   case 'fav':
     S.favs[i]=!S.favs[i];
     renderMenu();renderSaved();if(S.view==='dish')renderDish();
     break;
   case 'quickar':goAR(FOND);break;
   case 'quickfor':S.flt.rec=1;renderMenu();var l0=$('cats0');if(l0)$('v-menu').scrollTo({top:l0.offsetTop-70,behavior:'smooth'});break;
   case 'quickcust':S.dish=0;renderDish();show('dish');setTimeout(function(){var c=$('custom');if(c)$('v-dish').scrollTo({top:c.offsetTop-90,behavior:'smooth'})},120);break;
   case 'goask':show('ask');if(i>=0)reply(el.getAttribute('data-q')||CH[S.lang].chips[i]||t('g1')[0],i);break;
   case 'explore':{var l=$('cats');if(l)$('v-menu').scrollTo({top:l.offsetTop-70,behavior:'smooth'});break}
   case 'cat':S.cat=v;renderMenu();break;
   case 'flt':S.flt[v]=S.flt[v]?0:1;renderMenu();break;
   case 'ar':goAR(S.dish);break;
   case 'ardone':closeAR();break;
   case 'add':S.cart[i]=(S.cart[i]||0)+1;updBadge();toast(t('added'));break;
   case 'cart':openSheet('cart');break;
   case 'reserve':openSheet('reserve');break;
   case 'close':closeSheet();break;
   case 'party':party=parseInt(v,10);openSheet('reserve');break;
   case 'slot':slot=v;openSheet('reserve');break;
   case 'request':case 'place':{var f=$('sfine');if(f)f.textContent=t('demo');break}
   case 'intent':reply(i===7?t('hpq'):CH[S.lang].chips[i],i);break;
   case 'mic':$('fine').textContent=t('voice');break;
  }
});
document.addEventListener('input',function(e){var el=e.target;if(el.id==='spr'){var i=parseInt(el.getAttribute('data-i'),10);S.spice[i]=parseInt(el.value,10);$('spl').textContent=t('spiceL')[S.spice[i]]}});
$('askform').onsubmit=function(e){e.preventDefault();var q=$('askin').value.trim();if(!q)return;$('askin').value='';reply(q,-1)};


function renderWeb(){
  var P=TP[S.tpl],c=P[S.lang];
  var navR={conc:'<span class="rsv">'+t('concierge')+'</span>',concdark:'<span class="rsv" style="background:#4a3e2b;color:#fff;box-shadow:none">'+t('concierge')+'</span>',bag:I.bag,lang:'<span class="lang">EN ▾</span>',ai:'<span class="rsv" style="background:#17120d;color:#fff;box-shadow:none">AI '+'Concierge</span>'}[P.navR];
  var nav=P.nav.map(function(n,i){return '<span class="'+(i===0?'on':'')+'">'+n+'</span>'}).join('');
  var cats=[['all','dome','all'],['starters','leaf','starters'],['mains','menu','mains'],['seafood','wine','veg'],['desserts','cal','desserts']];
  var pool=D.filter(function(d){return S.webCat==='all'||d.cat===S.webCat});if(!pool.length)pool=D;
  var cards='';for(var j=0;j<3;j++){var d=pool[(S.webOff+j)%pool.length];cards+='<div class="wc" data-act="webdish" data-i="'+d.id+'"><div class="im" style="background-image:url('+d.img+')"></div><div class="t"><span>'+esc(dn(d).n)+'</span><span>$'+d.price+'</span></div></div>'}
  $('web').innerHTML='<div class="webf t-'+P.k+(P.dk?' dk':'')+'">'+
   '<div class="wnav"><div class="wlogo">'+(P.pre?'<small style="letter-spacing:.4em;margin-bottom:2px">'+P.pre+'</small>':'')+P.n+(P.pre?'':'<small>'+P.s+'</small>')+'</div><nav>'+nav+'</nav><div class="wr">'+I.search+navR+'</div></div>'+
   '<div class="whero"><div class="wtxt"><div class="eyebrow">'+esc(c[0])+'</div><h1 class="disp">'+esc(c[1])+'</h1><p>'+esc(c[2])+'</p><span class="wbtn" data-act="gophone">'+t('explore')+' '+I.arrow+'</span></div><div class="wimg" style="background-image:url('+P.img+')"></div></div>'+
   '<div class="wcats">'+cats.map(function(x){return '<button class="'+(S.webCat===x[0]?'on':'')+'" data-act="webcat" data-v="'+x[0]+'">'+I[x[1]]+'<span>'+t(x[2])+'</span></button>'}).join('')+'</div>'+
   '<div class="wcards"><button class="warr" data-act="webprev">'+I.back+'</button>'+cards+'<button class="warr" data-act="webnext">'+I.next+'</button></div></div>';
}
function setMode(){
  document.body.classList.toggle('webmode',S.mode==='web');
  Array.prototype.forEach.call($('modes').children,function(b){b.classList.toggle('on',b.getAttribute('data-v')===S.mode)});
  if(S.mode==='web')renderWeb();else{resize()}
}
function setTpl(){
  var P=TP[S.tpl];app.className='app t-'+P.k+(P.dk?' dk':'');
  Array.prototype.forEach.call($('skins').children,function(b,j){b.classList.toggle('on',j===S.tpl)});
  renderAll();applySkin3D();if(S.mode==='web')renderWeb();
}
$('skins').innerHTML=TP.map(function(p,j){return '<button data-act="skin" data-v="'+j+'" class="'+(j===0?'on':'')+'">'+p.label+'</button>'}).join('');
['menu','dish','saved','ask'].forEach(function(k){var el=$('v-'+k);el.addEventListener('scroll',function(){$('hdr').classList.toggle('solid',el.scrollTop>(k==='dish'?330:30))})});
function boot(){
  try{build()}catch(err){}
  if(!MENU&&Q.get('tpl')){TP.forEach(function(p,j){if(p.k===Q.get('tpl'))S.tpl=j})}
  setTpl();resetChat();
  if(Q.get('mode')==='web'){S.mode='web';setMode()}
  if(Q.get('dish')!=null){var di=parseInt(Q.get('dish'),10);if(D[di]){S.dish=di;renderDish();show('dish')}}
}
if(Q.get('menu')){fetch(Q.get('menu')).then(function(r){return r.json()}).then(function(m){applyMenu(m);boot()}).catch(function(){boot()})}
else boot();
})();
</script>
</body>
